services:
  tradeghost-api:
    build:
      context: .
      dockerfile: tradeghost/docker/Dockerfile
    container_name: tradeghost-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
  tradeghost-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tradeghost-web
    environment:
      - BACKEND_URL=http://tradeghost-api:8000
    depends_on:
      - tradeghost-api
    ports:
      - "3000:3000"
    restart: unless-stopped
